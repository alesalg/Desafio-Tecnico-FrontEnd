<div class="filters-page">
  <div class="filters-header-banner">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#C62828" stroke-width="2.5">
      <circle cx="11" cy="11" r="7"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <span>BUSCA</span>
  </div>

  <div class="filters-actions-top">
    <button class="action-link" (click)="cancel()">CANCELAR</button>
    <span class="action-title">FILTROS</span>
    <button class="action-link" (click)="clearFilters()">LIMPAR</button>
  </div>

  <section class="filter-section">
    <div class="section-header-row">
      <h3>Tipos de carrocerias</h3>
      <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C62828" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <div class="checkbox-grid">
      @for (type of vehicleService.availableTypes(); track type) {
        <label class="checkbox-item" (click)="toggleType(type)">
          <span class="checkbox" [class.checked]="isTypeSelected(type)"></span>
          <span>{{ type }}</span>
        </label>
      }
    </div>
  </section>

  <section class="filter-section">
    <div class="section-header-row">
      <h3>Tipos de motores</h3>
      <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C62828" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <div class="chip-grid">
      @for (engine of vehicleService.availableEngines(); track engine) {
        <button
          class="chip"
          [class.selected]="isEngineSelected(engine)"
          (click)="toggleEngine(engine)"
        >
          Motor {{ engine }}
        </button>
      }
    </div>
  </section>

  <section class="filter-section">
    <div class="section-header-row">
      <h3>Quantidade de lugares</h3>
      <svg class="chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#C62828" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </div>
    <div class="chip-grid">
      @for (size of vehicleService.availableSizes(); track size) {
        <button
          class="chip"
          [class.selected]="isSizeSelected(size)"
          (click)="toggleSize(size)"
        >
          {{ size.padStart(2, '0') }}
        </button>
      }
    </div>
  </section>

  <div class="apply-container">
    <button class="btn-apply" (click)="applyFilters()">APLICAR FILTRO</button>
  </div>
</div>
